<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; padding: 15px; font-family: Arial, sans-serif; }
    h3 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 6px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin: 4px 0; border: none; border-radius: 4px; color: white; font-weight: bold; }
    #recordBtn { background: #e22; }
    #stopBtn { background: #666; display: none; }
    #playBtn { background: #080; }
  </style>
</head>
<body>
<h3>Action Recorder</h3>
<label>Play Loops:</label>
<input type="number" id="loopCount" value="1" min="1">

<button id="recordBtn">Start Record</button>
<button id="stopBtn">Stop Record</button>
<button id="playBtn">Play</button>

<script src="popup.js"></script>
</body>
</html>
