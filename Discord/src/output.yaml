signEmbedDes:
  enUS: Click the [Check-In] button to earn points~ Points can be redeemed for valuable
    rewards~ Click {0} to enter the redemption channel~ (You can check-in once every
    24 hours) Click the [Query] button to check your remaining points, last check-in
    time, and in-game UID information. Click the [Bind] button to bind your in-game
    UID (Binding UID will earn you 1 point)
  jaJP: ''
  koKR: '[출석] 버튼을 클릭하면 포인트를 획득할 수 있습니다.

    포인트로 보상을 교환할 수 있습니다.

    {0} 클릭하면 교환 화면으로 이동할 수 있습니다.

    (24시간 내에 1번만 출석 가능)

    [조회] 버튼을 클릭하면 남은 포인트, 지난 번 출석 시간과 인게임 UID를 확인할 수 있습니다.

    [연동] 버튼을 클릭하면 인게임 UID와 연동할 수 있습니다.(UID와 연동 성공 후 포인트 1점 획득 가능)'
  zhCN: '点击【签到】按钮可获得积分哟～

    积分可以兑换超值奖励～

    点击{0}可进入兑换频道哟～

    （每24小时可签到1次）

    点击【查询】按钮可获取剩余积分、上次签到时间及游戏内UID信息

    点击【绑定】按钮，可绑定游戏内UID（绑定UID可获得1积分）'
  zhTW: '點擊【簽到】按鈕可獲得積分喲～

    積分可以兌換超值獎勵～

    點擊{0}可進入兌換頻道喲～

    （每24小時可簽到1次）

    點擊【查詢】按鈕可獲取剩餘積分、上次簽到時間及遊戲內UID信息

    點擊【綁定】按鈕，可綁定遊戲內UID（綁定UID可獲得1積分）'
